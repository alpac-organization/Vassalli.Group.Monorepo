name: Release & Validation

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # --- PASOS DE VALIDACIÓN (Corren siempre: PRs y Pushes) --- #
      
      - name: Build UI Package
        run: yarn workspace @alpac/ui build
        # Ajusta @alpac/ui al nombre exacto en su package.json

      - name: Build ERP App
        run: yarn workspace erp-alpac-group build

      # --- PROCESO DE RELEASE (Solo en Push a ramas principales, NO en PRs) --- #

      - name: Create Release Pull Request or Publish
        id: changesets
        if: |
          github.event_name == 'push' && 
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: changesets/action@v1
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notification on Publish
        if: steps.changesets.outputs.published == 'true'
        run: echo "Se ha publicado una nueva versión de ${GITHUB_REPOSITORY}!"